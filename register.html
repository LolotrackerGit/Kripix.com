    <!-- ========================================== -->
    <!-- FAVICON (ICONA SULLA TAB DEL BROWSER)      -->
    <!-- ========================================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <title>Registrazione - Kripix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&family=Courier+Prime&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-grid"></div>

    <nav>
        <div class="logo-text"><a href="index.html">KRIPIX</a></div>
        <a href="index.html" class="back-link">← ANNULLA</a>
    </nav>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>NUOVO AGENTE</h2>
                <p style="font-family:'Courier Prime'; font-size:0.8rem; color:#888;">INIZIALIZZAZIONE PROTOCOLLO CLOUD</p>
            </div>

            <form class="terminal-form" id="registerForm" novalidate>
                
                <div class="input-group">
                    <label>EMAIL OPERATIVA</label>
                    <input type="email" id="email" placeholder="nome@esempio.com" required>
                    <div class="validation-msg" id="msg-email"></div>
                </div>

                <div class="input-group">
                    <label>NOME IN CODICE (USERNAME)</label>
                    <input type="text" id="regUsername" placeholder="Scegli il tuo ID" required autocomplete="off">
                    <div class="validation-msg" id="msg-user"></div>
                </div>

                <div class="input-group">
                    <label>PASSWORD (Min 8 car. + 1 Numero)</label>
                    <input type="password" id="pass1" placeholder="Crea password" required>
                    <div class="validation-msg" id="msg-pass1"></div>
                </div>

                <div class="input-group">
                    <label>CONFERMA PASSWORD</label>
                    <input type="password" id="pass2" placeholder="Ripeti password" required>
                    <div class="validation-msg" id="msg-pass2"></div>
                </div>

                <!-- Messaggio di errore/successo globale dal Server -->
                <div class="validation-msg" id="msg-server" style="text-align: center; margin-bottom: 15px; font-size: 0.85rem;"></div>

                <button type="submit" class="btn-gold full-width glow-effect">CREA ACCOUNT</button>
            </form>

            <div class="login-footer">
                <p>Hai già un ID?</p>
                <a href="login.html" class="register-link">TORNA AL LOGIN</a>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <script type="module">
        import { auth, db } from './script.js';
        import { createUserWithEmailAndPassword, sendEmailVerification, signOut, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { doc, setDoc, getDoc, writeBatch, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Approccio di Sicurezza: Creeremo un "username" unico per evitare che due persone si registrino con lo stesso nome
        // Questo è un approccio comune e molto sicuro
        const usernamesCol = collection(db, "usernames");

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const emailInput = document.getElementById('email');
            const usernameInput = document.getElementById('regUsername');
            const pass1Input = document.getElementById('pass1');
            const pass2Input = document.getElementById('pass2');
            const serverMsg = document.getElementById('msg-server');
            const btnSubmit = this.querySelector('button');
            
            const email = emailInput.value.trim();
            const username = usernameInput.value.trim();
            const password = pass1Input.value;

            if (password !== pass2Input.value) { alert("Le password non coincidono!"); return; }

            btnSubmit.innerHTML = 'VERIFICA PROTOCOLLO...';
            btnSubmit.style.pointerEvents = 'none';

            // 1. Controlliamo se lo username è disponibile
            const usernameDocRef = doc(db, "usernames", username.toLowerCase());
            const usernameDoc = await getDoc(usernameDocRef);
            
            if (usernameDoc.exists()) {
                serverMsg.innerText = '>> ERRORE: ID GIÀ IN USO NEL SISTEMA';
                serverMsg.style.display = 'block';
                btnSubmit.innerHTML = 'CREA ACCOUNT';
                btnSubmit.style.pointerEvents = 'auto';
                return;
            }
            
            let firebaseUser = null;
            try {
                // 2. Creiamo l'account in Firebase Auth
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                firebaseUser = userCredential.user;

                // 3. Usiamo una "transazione" (batch) per creare sia il profilo che il documento username.
                // Se una delle due operazioni fallisce, falliscono entrambe.
                const batch = writeBatch(db);
                
                const userDocRef = doc(db, "users", firebaseUser.uid);
                batch.set(userDocRef, {
                    uid: firebaseUser.uid,
                    username: username,
                    email: email,
                    isAdmin: false,
                    color: '#e3c66c',
                    createdAt: new Date().toISOString(),
                    
                    // --- NUOVI CAMPI INIZIALIZZATI ---
                    games:[],         // Array vuoto per i giochi
                    keys: {},          // Oggetto vuoto per le licenze
                    friends:[],       // Array vuoto per gli amici
                    requests:[],      // Array vuoto per le richieste in entrata
                    privacy: {         // Impostazioni privacy di base
                        visibility: true,
                        telemetry: false,
                        newsletter: false
                    }
                });
                // Documento dello username per il controllo unicità
                batch.set(usernameDocRef, { uid: firebaseUser.uid });

                // Eseguiamo la transazione
                await batch.commit();

                // 4. Se tutto è andato bene, inviamo la mail di verifica
                await sendEmailVerification(firebaseUser);
                await signOut(auth);

                serverMsg.innerText = ">> PROTOCOLLO INVIATO. Controlla la tua posta per confermare l'identità.";
                serverMsg.style.color = "var(--accent-gold)";
                serverMsg.style.display = 'block';
                btnSubmit.innerHTML = 'REGISTRAZIONE COMPLETATA';

                setTimeout(() => { window.location.href = 'login.html'; }, 4000);

            } catch (error) {
                // Se la registrazione fallisce DOPO aver creato l'utente in Auth (raro), lo cancelliamo per pulizia
                if (firebaseUser) {
                    await deleteUser(firebaseUser);
                }
                
                btnSubmit.innerHTML = 'CREA ACCOUNT';
                btnSubmit.style.pointerEvents = 'auto';

                if (error.code === 'auth/email-already-in-use') {
                    serverMsg.innerText = '>> ERRORE: EMAIL GIÀ REGISTRATA';
                } else {
                    serverMsg.innerText = '>> ERRORE SERVER: ' + error.message;
                }
                serverMsg.style.display = 'block';
                console.error(error);
            }
        });
    </script>
</body>
</html>
