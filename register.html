<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="description" content="Kripix Entertainment: A different way to see pixels">
    <meta name="keywords" content="videogiochi, sviluppo indie, kripix, il filo del dubbio, pixel otros, engine narrativo, thriller psicologico">

    <meta property="og:description" content="Esplora i nostri mondi immersivi. Scopri 'Il Filo del Dubbio' e accedi al network operativo per gli agenti Kripix.">
    <meta property="og:image" content="https://kripix.netlify.app/SocialPreview.png">
    <meta property="og:url" content="https://kripix.netlify.app/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kripix Entertainment">
    <meta name="twitter:description" content="Creatori di esperienze narrative ad alta tensione. Unisciti al network.">
    <meta name="twitter:image" content="https://kripix.netlify.app/SocialPreview.png">
    <meta name="theme-color" content="#05070a">
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="icon" href="favicon.ico">

    <title>Registrazione - Kripix</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&family=Courier+Prime&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-grid"></div>
    <nav>
        <div class="logo-text"><a href="index.html">KRIPIX</a></div>
        <a href="index.html" class="back-link">← ANNULLA</a>
    </nav>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>NUOVO AGENTE</h2>
                <p style="font-family:'Courier Prime'; font-size:0.8rem; color:#888;">INIZIALIZZAZIONE PROTOCOLLO CLOUD</p>
            </div>
            <form class="terminal-form" id="registerForm" novalidate>
                <div class="input-group">
                    <label>EMAIL OPERATIVA</label>
                    <input type="email" id="email" placeholder="nome@esempio.com" required>
                </div>
                <div class="input-group">
                    <label>NOME IN CODICE (USERNAME)</label>
                    <input type="text" id="regUsername" placeholder="Scegli il tuo ID" required autocomplete="off">
                </div>
                <div class="input-group">
                    <label>PASSWORD (Min 8 car. + 1 Numero)</label>
                    <input type="password" id="pass1" placeholder="Crea password" required>
                </div>
                <div class="input-group">
                    <label>CONFERMA PASSWORD</label>
                    <input type="password" id="pass2" placeholder="Ripeti password" required>
                </div>
                <div class="validation-msg" id="msg-server" style="text-align: center; margin-bottom: 15px; font-size: 0.85rem; display:none;"></div>
                <button type="submit" id="btn-submit" class="btn-gold full-width glow-effect">CREA ACCOUNT</button>
            </form>
            <div class="login-footer">
                <p>Hai già un ID?</p>
                <a href="login.html" class="register-link">TORNA AL LOGIN</a>
            </div>
        </div>
    </div>

    <!-- SCRIPT FIREBASE -->
    <!-- SCRIPT FIREBASE -->
<script type="module">
    import { app, auth } from './script.js';
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-functions.js";
    import { signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    
    const functions = getFunctions(app, 'europe-west1');

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const email = document.getElementById('email').value.trim();
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('pass1').value;
        const pass2 = document.getElementById('pass2').value;
        
        const serverMsg = document.getElementById('msg-server');
        const btnSubmit = document.getElementById('btn-submit');

        if (!email || !username || !password) return;
        
        if (password !== pass2) {
            serverMsg.innerText = ">> Le password non coincidono.";
            serverMsg.style.color = '#ff5555';
            serverMsg.style.display = 'block';
            return;
        }
        if (password.length < 8) {
            serverMsg.innerText = ">> La password è troppo corta.";
            serverMsg.style.color = '#ff5555';
            serverMsg.style.display = 'block';
            return;
        }

        btnSubmit.innerHTML = 'INIZIALIZZAZIONE...';
        btnSubmit.disabled = true;
        serverMsg.style.display = 'block';

        try {
            // FASE 1: Creazione account sul Server (Cloud Function)
            serverMsg.innerText = ">> FASE 1: Creazione dossier nel Cloud...";
            serverMsg.style.color = "var(--text-main)";

            const createUserAccount = httpsCallable(functions, 'createUserAccount');
            const result = await createUserAccount({ email, password, username });

            if (result.data.status === 'success') {
                
                // FASE 2: Eseguiamo il login invisibile
                serverMsg.innerText = ">> FASE 2: Connessione per l'invio mail...";
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                
                // FASE 3: Mandiamo la Mail di Default di Firebase
                serverMsg.innerText = ">> FASE 3: Trasmissione mail di sistema Firebase in corso...";
                await sendEmailVerification(userCredential.user);
                
                // Slogghiamo l'utente
                await signOut(auth);

                // FATTO!
                serverMsg.innerText = ">> PROTOCOLLO COMPLETATO! Controlla la tua casella email (anche nello Spam).";
                serverMsg.style.color = "var(--accent-gold)";
                btnSubmit.innerHTML = 'REGISTRAZIONE COMPLETATA';

                setTimeout(() => { window.location.href = 'login.html'; }, 4000);
            }

        } catch (error) {
            serverMsg.innerText = '>> ERRORE: ' + error.message;
            serverMsg.style.color = '#ff5555';
            btnSubmit.innerHTML = 'CREA ACCOUNT';
            btnSubmit.disabled = false;
        }
    });
</script>
</body>
</html>
