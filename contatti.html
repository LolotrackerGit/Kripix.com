    <!-- LOGICA DI INVIO EMAIL -->
    <script>
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault(); 
            
            const btn = document.getElementById('btn-submit');
            const statusMsg = document.getElementById('status-msg');
            
            const originalText = btn.innerText;
            btn.innerText = 'TRASMISSIONE IN CORSO...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none'; 
            statusMsg.style.display = 'none';

            const serviceID = 'service_4xvl1j1';
            const templateID = 'template_fzcket8';

            emailjs.sendForm(serviceID, templateID, this)
                .then(() => {
                    btn.innerText = 'DOSSIER INVIATO';
                    btn.style.background = '#4caf50';
                    btn.style.borderColor = '#4caf50';
                    btn.style.color = '#000';
                    
                    statusMsg.innerText = ">> PROTOCOLLO COMPLETATO. RICEVERAI RISPOSTA A BREVE.";
                    statusMsg.style.color = "#4caf50";
                    statusMsg.style.display = "block";
                    
                    this.reset(); 
                    
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.background = 'transparent';
                        btn.style.borderColor = 'var(--accent-gold)';
                        btn.style.color = 'var(--accent-gold)';
                        btn.style.opacity = '1';
                        btn.style.pointerEvents = 'auto';
                        statusMsg.style.display = 'none';
                    }, 5000);

                }, (err) => {
                    btn.innerText = 'ERRORE DI TRASMISSIONE';
                    btn.style.borderColor = '#ff5555';
                    btn.style.color = '#ff5555';
                    btn.style.opacity = '1';
                    
                    statusMsg.innerText = ">> ERRORE SERVER: " + JSON.stringify(err);
                    statusMsg.style.color = "#ff5555";
                    statusMsg.style.display = "block";
                    
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.borderColor = 'var(--accent-gold)';
                        btn.style.color = 'var(--accent-gold)';
                        btn.style.pointerEvents = 'auto';
                    }, 5000);
                });
        });
    </script>

   <!-- LOGICA AUTO-COMPLETAMENTO TRAMITE FIREBASE (FIX SICUREZZA) -->
    <script type="module">
        import { auth, db } from './script.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                // 1. Prendiamo l'email direttamente dal sistema di autenticazione!
                document.querySelector('input[name="user_email"]').value = user.email;
                
                // 2. Dal database leggiamo solo l'username pubblico
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if(userSnap.exists()) {
                    document.querySelector('input[name="user_name"]').value = userSnap.data().username;
                }
            }
        });
    </script>
