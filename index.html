    <style>
        /* EVITA SCROLL ORIZZONTALE SU MOBILE */
        body { overflow-x: hidden; }

        /* HERO SECTION A SCHERMATA SINGOLA */
        .hero { 
            height: 100vh; /* Esattamente l'altezza dello schermo */
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            padding: 80px 5% 0; /* Spazio per la navbar */
            box-sizing: border-box;
            overflow: hidden; /* Blocca lo scroll su PC */
        }

        .brand-title { font-size: clamp(3rem, 6vw, 5rem); font-weight: 900; letter-spacing: 10px; line-height: 1; margin: 0; }
        .brand-subtitle { font-size: clamp(1rem, 2vw, 1.5rem); font-weight: 300; color: var(--accent-red); letter-spacing: 8px; margin-bottom: 15px; margin-top: -10px; }
        
        /* FIX MOBILE PER TYPEWRITER */
        .tagline { margin-bottom: 30px; color: var(--text-muted); font-size: clamp(0.8rem, 2vw, 1rem); }
        .typewriter { width: min(34ch, 100%); white-space: nowrap; overflow: hidden; }

        /* DASHBOARD DELLE NEWS: Stretta e vicina ai bottoni */
        .news-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            margin-top: 30px;
            text-align: left;
        }

        .news-card {
            background: rgba(10, 10, 10, 0.6); 
            backdrop-filter: blur(5px); 
            border: 1px solid #222;
            border-top: 2px solid var(--accent-gold);
            padding: 20px;
            text-decoration: none; 
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            box-sizing: border-box;
        }
        
        .news-card:hover {
            border-color: var(--accent-gold);
            background: rgba(227, 198, 108, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
        }

        /* Il padding-right evita che il testo vada sotto l'icona */
        .news-card-title { color: var(--text-main); font-size: 1rem; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; padding-right: 25px; }
        .news-card-date { font-family: 'Courier Prime', monospace; font-size: 0.7rem; color: #666; margin-bottom: 10px; }
        .news-card-body { color: #888; font-size: 0.85rem; line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        /* STILE PRIORITÀ ALTA */
        .news-card.priority-high {
            grid-column: 1 / -1; 
            border-top-color: var(--accent-red);
            background: rgba(139, 35, 35, 0.05);
            padding: 25px 20px;
        }
        .news-card.priority-high:hover { border-color: var(--accent-red); background: rgba(139, 35, 35, 0.1); }
        .news-card.priority-high .news-card-title { color: var(--accent-red); font-size: 1.3rem; }

        /* ICONA FRECCIA (Ancorata in alto a destra) */
        .link-icon { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #444; 
            font-size: 1.2rem; 
            transition: 0.3s; 
            line-height: 1;
        }
        .news-card:hover .link-icon { color: var(--accent-gold); }
        .news-card.priority-high:hover .link-icon { color: var(--accent-red); }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .news-dashboard { grid-template-columns: 1fr; margin-bottom: 40px; }
            .hero { 
                height: auto; /* Su mobile bisogna scorrere per forza */
                min-height: 100vh;
                padding-top: 120px; 
                justify-content: flex-start;
            }
        }
    </style>

<body>
    
    <div class="background-grid"></div>

<nav id="main-nav"></nav>

    <!-- CRUSCOTTO CENTRALE (Tutto in una schermata su PC) -->

        <!-- DASHBOARD NEWS -->
        <div class="news-dashboard" id="news-feed-container">
            <p style="font-family:'Courier Prime'; color:#666; grid-column: 1/-1; text-align:center; padding: 20px;">

    <script type="module" src="script.js"></script>
    
   <!-- (Mantieni tutto l'html e lo stile di index.html uguale, cambia solo questo script alla fine del file) -->

    <!-- LOGICA FIREBASE NEWS -->
    <script type="module">
        import { db } from './script.js';
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const feedContainer = document.getElementById('news-feed-container');

            try {
                const q = query(collection(db, "news"), orderBy("date", "desc"), limit(6));
                const querySnapshot = await getDocs(q);

                feedContainer.innerHTML = ''; 

                if (querySnapshot.empty) {
                    feedContainer.innerHTML = '<p style="font-family:\'Courier Prime\'; color:#666; grid-column: 1/-1; text-align:center;">>> Nessuna comunicazione attiva.</p>';
                    return;
                }

                let highPriorityNews = [];
                let normalNews =[];

                querySnapshot.forEach((doc) => {
                    const news = doc.data();
                    if (news.priority === 'high' && highPriorityNews.length === 0) {
                        highPriorityNews.push(news);
                    } else if (news.priority !== 'high' && normalNews.length < 3) {
                        normalNews.push(news);
                    }
                });

                const sortedNews =[...highPriorityNews, ...normalNews];

                // FIX SICUREZZA: Creazione Nodi DOM Sicuri contro attacchi XSS
                sortedNews.forEach((news) => {
                    const d = new Date(news.date);
                    const formattedDate = d.toLocaleDateString('it-IT');
                    
                    const cardNode = document.createElement(news.link ? 'a' : 'div');
                    cardNode.className = `news-card ${news.priority === 'high' ? 'priority-high' : ''}`;
                    if (news.link) cardNode.href = news.link; // Assicurati che news.link sia validato in futuro!

                    if (news.link) {
    // FIX SICUREZZA: Controlla che il link sia un vero URL HTTP/HTTPS
    if (news.link.startsWith('http://') || news.link.startsWith('https://')) {
        cardNode.href = news.link;
    } else {
        cardNode.href = "#"; // Se tenta hack strani, neutralizza il link
    }
}

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'news-card-title';
                    titleDiv.textContent = news.title; // SICURO: textContent non esegue script html

                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'news-card-date';
                    dateDiv.textContent = `${formattedDate} | Kripix Overseer`;

                    const bodyDiv = document.createElement('div');
                    bodyDiv.className = 'news-card-body';
                    bodyDiv.textContent = news.body; // SICURO

                    cardNode.appendChild(titleDiv);
                    cardNode.appendChild(dateDiv);
                    cardNode.appendChild(bodyDiv);

                    feedContainer.appendChild(cardNode);
                });

            } catch (error) {
                console.error("Errore recupero news:", error);
                feedContainer.innerHTML = '<p style="font-family:\'Courier Prime\'; color:#ff5555; grid-column: 1/-1; text-align:center;">>> Errore di connessione al terminale news.</p>';
            }
        });
    </script>
</body>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const MESE_FONDAZIONE = 4; // Maggio
        const GIORNO_FONDAZIONE = 19;
        const oggi = new Date();

        if (oggi.getMonth() === MESE_FONDAZIONE && oggi.getDate() === GIORNO_FONDAZIONE) {
            const taglineElement = document.querySelector('.typewriter');
            if (taglineElement) {
                const easterEggText = "Habemus Kripix";
                
                // 1. UCCIDIAMO DEFINITIVAMENTE L'ANIMAZIONE CSS
                taglineElement.style.animation = 'none';
                taglineElement.style.width = 'auto';
                taglineElement.textContent = ''; // Svuotiamo il testo

                // 2. RIACCENDIAMO SOLO IL CURSORE LAMPEGGIANTE
                taglineElement.classList.add('cursor-blink');

                // 3. LA VERA MACCHINA DA SCRIVERE (PURO JAVASCRIPT)
                let i = 0;
                const typingInterval = setInterval(() => {
                    // Aggiungiamo una lettera alla volta
                    taglineElement.textContent += easterEggText.charAt(i);
                    i++;
                    
                    // Quando abbiamo finito, fermiamo l'intervallo
                    if (i > easterEggText.length -1) {
                        clearInterval(typingInterval);
                        // Opzionale: puoi far smettere di lampeggiare il cursore togliendo la classe
                        // taglineElement.classList.remove('cursor-blink');
                    }
                }, 100); // 100 millisecondi per lettera (puoi aumentare/diminuire per renderlo più lento/veloce)

                console.log("%c[EASTER EGG ATTIVATO] >> HABEMUS KRIPIX!", "color: #e3c66c;");
            }
        }
    });
</script>
